name: Deploy Joscity

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SECRET }}
          script: |
            set -e
            cd /root/JosCity
            git fetch --all
            git checkout master || git checkout -B master origin/master
            git reset --hard origin/master
            npm install
            npm run build
            systemctl reload nginx
            pm2 restart Joscity-frontend || true
            pm2 save || true
